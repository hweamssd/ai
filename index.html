<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>East Asia ICT MSSD AI Brief</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1a1a1a;--muted:#6b6b6b;--line:#e4e4e0;--accent:#2b59c3}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--text:#ededed;--muted:#9a9a9a;--line:#2e2e2e;--accent:#7aa2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding:40px 16px 60px}
h1{margin:0 0 4px;font-size:28px}
.sub{color:var(--muted);margin:0 0 28px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat b{display:block;font-size:24px}
.stat span{color:var(--muted);font-size:13px}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:4px}
.head h1{margin:0}
#langbar{display:flex;gap:4px;flex-wrap:wrap}
#langbar button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;cursor:pointer}
#langbar button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.links a{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--text);text-decoration:none}
.links a:hover{border-color:var(--accent)}
input{width:100%;padding:14px 16px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);margin-bottom:6px}
.hint{color:var(--muted);font-size:13px;margin:0 0 20px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px;color:var(--text);text-decoration:none}
.card:hover{border-color:var(--accent)}
.date{color:var(--accent);font-size:13px;font-weight:600}
.card h2{font-size:18px;margin:4px 0 6px}
.card p{margin:0;color:var(--muted);font-size:14px}
.tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;background:var(--bg);border-radius:6px;padding:2px 8px;color:var(--muted)}
mark{background:#ffe48a;color:#000;border-radius:3px}
.empty{color:var(--muted);text-align:center;padding:40px 0;display:none}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:40px}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>East Asia ICT MSSD AI Brief</h1><div id="langbar"></div></div>
  <p class="sub" id="sub"></p>

  <div class="stats">
    <div class="stat"><b id="sDays">0</b><span data-t="days"></span></div>
    <div class="stat"><b id="sItems">0</b><span data-t="items"></span></div>
    <div class="stat"><b id="sRange">-</b><span data-t="range"></span></div>
  </div>

  <div class="links" id="links"></div>

  <input id="q" type="search" placeholder="">
  <p class="hint" data-t="hint"></p>

  <div id="list"></div>
  <p class="empty" id="empty" data-t="empty"></p>

  <footer data-t="footer"></footer>
</div>
<script src="assets/lang.js"></script>
<script>
const UI={
  zh:{days:'累计日报（天）',items:'累计条目',range:'覆盖区间',ph:'关键词搜索（如：英伟达、半导体）',hint:'搜索范围覆盖标题、摘要与全部新闻条目；点击卡片打开当日完整日报。',empty:'没有匹配结果，换个关键词试试',footer:'East Asia ICT MSSD AI Brief · 自动归档',sub:d=>'每日简报归档 · 关键词检索 · 数据截至 '+d,n:'条'},
  en:{days:'Daily briefs',items:'Total items',range:'Coverage',ph:'Search keywords (e.g. NVIDIA, semiconductors)',hint:'Searches titles, summaries and all news items. Click a card to open the full brief.',empty:'No results. Try another keyword.',footer:'East Asia ICT MSSD AI Brief · Auto-archived',sub:d=>'Daily brief archive · Keyword search · Updated '+d,n:'items'},
  ko:{days:'누적 브리프(일)',items:'누적 항목',range:'기간',ph:'키워드 검색 (예: 엔비디아, 반도체)',hint:'제목·요약·항목 전체 검색. 카드 클릭 시 해당일 브리프 열림.',empty:'결과 없음. 다른 키워드로 검색.',footer:'East Asia ICT MSSD AI Brief · 자동 아카이브',sub:d=>'매일 브리프 모음 · 키워드 검색 · '+d+' 기준',n:'건'},
  ja:{days:'累計ブリーフ（日）',items:'累計項目',range:'対象期間',ph:'キーワード検索（例：NVIDIA、半導体）',hint:'タイトル・要約・全ニュース項目を検索。カードをクリックで当日のブリーフを表示。',empty:'該当なし。別のキーワードでお試しください。',footer:'East Asia ICT MSSD AI Brief · 自動アーカイブ',sub:d=>'毎日のブリーフ集 · キーワード検索 · '+d+' 時点',n:'件'}
};
let briefs=[],links=[],lang='ko',lastDate='';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=(s,q)=>{s=esc(s);if(!q)return s;return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')};
const pick=(v,l)=>v==null?'':typeof v==='string'?v:(v[l]||v.ko||v.zh||'');
const nItems=b=>{const t=b.title&&typeof b.title==='object';const n=(b.items||[]).length;return t?Math.round(n/(('en' in b.title)?4:3)):n};

function texts(){
  const u=UI[lang];
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=u[el.dataset.t]);
  document.getElementById('q').placeholder=u.ph;
  document.getElementById('sub').textContent=lastDate?u.sub(lastDate):'';
}
function render(q=''){
  q=q.trim();const ql=q.toLowerCase();
  const rows=briefs.filter(b=>!q||[pick(b.title,'zh'),pick(b.title,'ko'),pick(b.title,'ja'),pick(b.title,'en'),pick(b.summary,'zh'),pick(b.summary,'ko'),pick(b.summary,'ja'),pick(b.summary,'en'),...(b.items||[]),...(b.tags||[])].join(' ').toLowerCase().includes(ql));
  document.getElementById('list').innerHTML=rows.map(b=>{
    const own=(pick(b.title,lang)+' '+pick(b.summary,lang)).toLowerCase().includes(ql);const hit=q&&!own?(b.items||[]).find(i=>i.toLowerCase().includes(ql)):null;
    return `<a class="card" href="${esc(b.url)}?lang=${lang}">
      <div class="date">${esc(b.date)}</div>
      <h2>${hl(pick(b.title,lang),q)}</h2>
      <p>${hl(hit||pick(b.summary,lang),q)}</p>
      ${b.tags?`<div class="tags">${b.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
    </a>`}).join('');
  document.getElementById('empty').style.display=rows.length?'none':'block';
}
fetch('data/briefs.json').then(r=>r.json()).then(d=>{
  briefs=(d.briefs||[]).sort((a,b)=>b.date.localeCompare(a.date));
  const dates=briefs.map(b=>b.date).sort();
  document.getElementById('sDays').textContent=briefs.length;
  document.getElementById('sItems').textContent=briefs.reduce((n,b)=>n+nItems(b),0);
  if(dates.length){const f=s=>s.slice(5).replace('-','.');document.getElementById('sRange').textContent=f(dates[0])+'–'+f(dates[dates.length-1]);lastDate=dates[dates.length-1];}
  document.getElementById('links').innerHTML=(d.links||[]).map(l=>`<a href="${esc(l.url)}">${esc(pick(l.title,lang))}</a>`).join('');
  texts();render(document.getElementById('q').value);
});
document.addEventListener('langchange',e=>{lang=e.detail;texts();render(document.getElementById('q').value);});
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
</script>
</body>
</html>
